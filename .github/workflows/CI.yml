# This workflows will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [
      dev,
      test,
      sit,
      uat,
      pre,
      gray,
      sim,
      fat,
      prod,
      master,
      main,
      dr
    ]
  pull_request:
    branches: [ master, main ]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'

jobs:
  build:
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        node-version: [ 14.x, 16.x, 18.x, 20.x ]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
        os: [
          windows-latest,
          macos-latest,
          ubuntu-latest
          #          ubuntu-18.04,
          #          ubuntu-20.04,
          #          macos-10.15,
          #          macos-11,
        ]
        exclude:
          # macos-latest is now an arm64 (Apple Silicon) image and Node.js 14 was never
          # published for darwin-arm64, so setup-node cannot install it there. The same
          # combination is re-added below on an Intel (x64) macOS image.
          - node-version: 14.x
            os: macos-latest
        include:
          - node-version: 14.x
            os: macos-26-intel
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Running environment initialization
        run: |
          npm i -g yarn && yarn install --frozen-lockfile
      #      - run: yarn run build --if-present
      - run: yarn run obfuscations